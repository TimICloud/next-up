<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Next Up</title>
  <meta name="description" content="Suis où tu en es dans tes séries et films, quelle que soit la plateforme de streaming.">
  <meta name="theme-color" content="#0b0b1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Next Up">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Logo Next Up : ▶ (épisode suivant) + ↑ (Up). Réutilisé partout via <use href="#nu-logo">. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="nu-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
      <radialGradient id="nu-h" cx="0.25" cy="0.15" r="0.75"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <symbol id="nu-logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="url(#nu-g)"/><rect width="64" height="64" rx="18" fill="url(#nu-h)"/><rect x="0.6" y="0.6" width="62.8" height="62.8" rx="17.4" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="1.2"/><path class="logo-play" d="M14 21.5 28.5 32 14 42.5Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><g class="logo-arrow" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M43 44.5V20"/><path d="M36.5 26 43 19.5 49.5 26"/></g></symbol>
  </svg>
  <!-- Animation d'ouverture : une fois par session, touche l'écran pour la passer. -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-glow"></div>
      <svg class="logo splash-logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="url(#nu-g)"/><rect width="64" height="64" rx="18" fill="url(#nu-h)"/><rect x="0.6" y="0.6" width="62.8" height="62.8" rx="17.4" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="1.2"/><path class="logo-play" d="M14 21.5 28.5 32 14 42.5Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><g class="logo-arrow" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M43 44.5V20"/><path d="M36.5 26 43 19.5 49.5 26"/></g></svg>
      <div class="splash-word">Next <span>Up</span></div>
      <p class="splash-tag">Reprends là où tu t’es arrêté.</p>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('splash');
      var seen = false;
      try { seen = sessionStorage.getItem('nextup:splash'); sessionStorage.setItem('nextup:splash', '1'); } catch (e) {}
      if (seen) { el.remove(); return; }
      function hide() { el.classList.add('out'); setTimeout(function () { el.remove(); }, 500); }
      var timer = setTimeout(hide, 2100);
      el.addEventListener('click', function () { clearTimeout(timer); hide(); });
    })();
  </script>
  <div class="app">
    <nav class="nav" aria-label="Navigation principale">
      <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#nu-logo"/></svg><span class="wordmark">Next <span>Up</span></span></div>
      <a href="#/" data-route="home">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Accueil</span>
      </a>
      <a href="#/library" data-route="library">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Bibliothèque</span>
      </a>
      <a href="#/add" data-route="add" class="nav-add" aria-label="Ajouter un titre">
        <span class="add-bubble"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span>Ajouter</span>
      </a>
      <a href="#/profile" data-route="profile">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span>Profil</span>
      </a>
    </nav>
    <header class="topbar">
      <a class="topbar-brand" href="#/" aria-label="Next Up, accueil"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#nu-logo"/></svg><span class="wordmark">Next <span>Up</span></span></a>
      <a class="topbar-avatar" id="top-avatar" href="#/profile" aria-label="Profil"></a>
    </header>
    <main id="view"></main>
  </div>
  <div id="sheet" class="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
